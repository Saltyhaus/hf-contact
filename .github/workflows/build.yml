name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_session tests.test_mercury_version tests.test_echo_service tests.test_extras -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # to create the release and attach the .exe on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      # --icon: the .exe's own icon; --add-data: the PNG the window uses (title bar, taskbar)
      - run: pyinstaller --onefile --windowed --name HF-Contact --icon assets/icon.ico --add-data "assets/icon.png;assets" hf-contact.py
      - uses: actions/upload-artifact@v4
        with:
          name: HF-Contact-windows
          path: dist/HF-Contact.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HF-Contact.exe
